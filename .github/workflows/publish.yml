name: Publish

# Tag-triggered publish via npm trusted publishing (GitHub Actions OIDC).
# No npm token is involved: the job mints a short-lived OIDC credential, so
# there is no secret to rotate and nothing to expire. Provenance attestations
# are generated automatically under trusted publishing - the --provenance flag
# is not needed.
#
# One-time setup on npmjs.com (package -> Settings -> Trusted Publishers):
#   Organization or user: pdfops
#   Repository:           pdfops-mcp
#   Workflow filename:    publish.yml
#   Allowed actions:      npm publish
#   Environment name:     (blank)

on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >=22.14.0 and npm >=11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Tag must match package.json version
        # Publishing v0.2.1 from a tree that says 0.2.0 is the drift this repo
        # already got bitten by (serverInfo reported 0.1.1 in a 0.2.0 release).
        # Fail before anything reaches the registry, where it is immutable.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != package.json $PKG"; exit 1; }

      - run: npm ci

      - name: Version consistency - src must match package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRV=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 30 node dist/index.js 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const l=s.trim().split('\n')[0];
                process.stdout.write(JSON.parse(l).result.serverInfo.version);
              })")
          echo "package.json=$PKG serverInfo=$SRV"
          [ "$PKG" = "$SRV" ] || { echo "version drift: package.json $PKG != serverInfo $SRV"; exit 1; }

      - name: Publish to npm
        run: npm publish
