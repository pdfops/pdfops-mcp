name: Publish

# Tag-triggered publish via npm trusted publishing (GitHub Actions OIDC).
# No npm token is involved: the job mints a short-lived OIDC credential, so
# there is no secret to rotate and nothing to expire. Provenance attestations
# are generated automatically under trusted publishing - the --provenance flag
# is not needed.
#
# One-time setup on npmjs.com (package -> Settings -> Trusted Publishers):
#   Organization or user: pdfops
#   Repository:           pdfops-mcp
#   Workflow filename:    publish.yml
#   Allowed actions:      npm publish
#   Environment name:     (blank)

on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >=22.14.0 and npm >=11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Tag must match package.json version
        # Publishing v0.2.1 from a tree that says 0.2.0 is the drift this repo
        # already got bitten by (serverInfo reported 0.1.1 in a 0.2.0 release).
        # Fail before anything reaches the registry, where it is immutable.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != package.json $PKG"; exit 1; }
          # server.json feeds the MCP registry step below; it must agree too.
          SRVJ=$(node -p "const s=require('./server.json'); s.version+' '+s.packages[0].version")
          [ "$SRVJ" = "$TAG $TAG" ] || { echo "server.json versions ($SRVJ) != tag $TAG"; exit 1; }

      - run: npm ci

      - name: Version consistency - src must match package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRV=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 30 node dist/index.js 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const l=s.trim().split('\n')[0];
                process.stdout.write(JSON.parse(l).result.serverInfo.version);
              })")
          echo "package.json=$PKG serverInfo=$SRV"
          [ "$PKG" = "$SRV" ] || { echo "version drift: package.json $PKG != serverInfo $SRV"; exit 1; }

      - name: Publish to npm
        # Skipped when the version is already on npm, so a re-run of this job
        # (e.g. after a registry-step failure) doesn't die on npm's 403.
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "pdfops-mcp@$VER" version >/dev/null 2>&1; then
            echo "pdfops-mcp@$VER already on npm; skipping"
          else
            npm publish
          fi

      # The official MCP registry (registry.modelcontextprotocol.io) lagged npm
      # whenever this was a manual step. Namespace dev.pdfops/* uses HTTP domain
      # auth: the public key is served at pdfops.dev/.well-known/mcp-registry-auth,
      # the private key is the MCP_REGISTRY_ED25519_PRIVATE_KEY_HEX secret.
      # Binary pinned to v1.8.1 and checked against the release's checksums file.
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP registry
        env:
          MCP_KEY: ${{ secrets.MCP_REGISTRY_ED25519_PRIVATE_KEY_HEX }}
        run: |
          ./mcp-publisher login http -domain pdfops.dev -private-key "$MCP_KEY"
          # The registry checks the npm version exists; npm's read side lags
          # a publish by minutes (0.3.5: >100s). Wait for it (up to 10 min).
          VER=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do
            curl -fsS "https://registry.npmjs.org/pdfops-mcp/$VER" >/dev/null 2>&1 && break
            echo "npm not serving $VER yet ($i/40)"; sleep 15
          done
          for i in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "attempt $i failed; retrying in 30s"; sleep 30
          done
          exit 1
